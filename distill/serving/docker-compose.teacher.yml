# vLLM teacher serving for TeleologyHI distillation.
#
# Usage:
#   export HF_TOKEN=hf_xxx
#   docker compose -f docker-compose.teacher.yml up -d
#   curl http://localhost:8000/v1/models
#
# Hardware floor for the default DeepSeek-R1 config:
#   2× A100 80GB, or 1× H100 80GB, or 4× L40S 48GB.
#
# To swap to Llama-3.3-70B: change `--model` + drop `--tensor-parallel-size`
# if running on a single 80GB GPU.

services:
  teacher:
    image: vllm/vllm-openai:v0.6.3
    runtime: nvidia
    ipc: host
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    command: >
      --model deepseek-ai/DeepSeek-R1
      --tensor-parallel-size 2
      --max-model-len 8192
      --gpu-memory-utilization 0.92
      --enable-prefix-caching
      --port 8000
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
