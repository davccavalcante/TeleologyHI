version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 0
    versioning-strategy: increase
    groups:
      types:
        patterns: ["@types/*"]
      build-tools:
        patterns: ["tsup", "typescript", "vitest"]
      llm-sdks:
        patterns: ["@anthropic-ai/*", "@modelcontextprotocol/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Hold major bumps for explicit review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 0
    groups:
      ci-actions:
        patterns: ["*"]
