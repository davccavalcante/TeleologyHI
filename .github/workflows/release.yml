name: release

# ─── Why this workflow exists ────────────────────────────────────────
#
# This workflow creates the GitHub-side artefacts of a release: a git
# tag and a matching GitHub Release whose body is the extracted section
# of `<pkg>/CHANGELOG.md`. It does NOT publish to the npm registry. The
# Creator's binding directive (2026-05-25 revised): the release artefact
# on GitHub MUST be reviewable before it propagates to NPMJS, because
# once a package version is on the npm registry it cannot be unpublished
# after 72 hours.
#
# The two-step release flow is therefore:
#
#   Step 1 (this workflow `release.yml`):
#     - Validate package + version + tag absence + CHANGELOG entry.
#     - Build + typecheck + test the entire monorepo.
#     - Pack dry-run as a final sanity check of the published artefact.
#     - Create the git tag `<pkg>-v<version>`.
#     - Create the GitHub Release with the title prefixed
#       `[REVIEW REQUIRED — NOT YET ON NPMJS]` and the body extracted
#       from `<pkg>/CHANGELOG.md`.
#     - Do NOT publish to npm.
#
#   Step 2 (`npm-publish.yml`):
#     - Verify the tag + GitHub Release from Step 1 exist.
#     - Verify monotonic version vs the npm registry (no backwards or
#       duplicate publishes).
#     - Build + pack dry-run + publish to npm with provenance.
#     - Update the GitHub Release title to
#       `[PUBLISHED ON NPMJS]` so the two-step state is visible.
#
# The Creator runs Step 1 immediately after a release-worthy change is
# pushed to main; reviews the resulting GitHub Release page (which
# carries the changelog, the tag, the commit, and any attached assets);
# and only then runs Step 2 to push the artefact to NPMJS.
#
# This is INTENTIONALLY non-atomic. The cost is one extra Creator
# action; the benefit is the freedom to discover a flaw in the release
# notes or the build output before the version becomes permanent on the
# npm registry.

on:
  workflow_dispatch:
    inputs:
      pkg:
        description: "Package short name (which @teleologyhi-sdk/<pkg> to release)"
        required: true
        type: choice
        options:
          - maic
          - him
          - nhe
      version:
        description: "Exact semver. MUST match <pkg>/package.json. Examples: 1.0.0-trinity, 1.0.1, 2.0.0-trinity."
        required: true
        type: string
      confirm:
        description: 'Type exactly: "YES-CREATE-GITHUB-RELEASE"'
        required: true
        type: string

permissions:
  contents: write     # required to create the git tag + GitHub Release
  # `id-token` is intentionally omitted here. npm provenance (which needs
  # `id-token: write`) happens in npm-publish.yml, not in this workflow.
  # GitHub Actions does not accept `id-token: read` as a value (only
  # `write` or `none`), and omitting it defaults to `none`.

# Serialise per (pkg, version) so two concurrent invocations on the same
# package + version cannot race on tag creation / release creation.
concurrency:
  group: release-${{ inputs.pkg }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: release (tag + GitHub Release) @teleologyhi-sdk/${{ inputs.pkg }}@${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Reject if confirmation phrase is wrong
        run: |
          expected="YES-CREATE-GITHUB-RELEASE"
          if [ "${{ inputs.confirm }}" != "$expected" ]; then
            echo "::error::Confirmation phrase mismatch. Re-run with confirm=\"$expected\"."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # full history for changelog extraction + tag-existence checks

      - name: Validate package matches input
        run: |
          case "${{ inputs.pkg }}" in
            maic|him|nhe) ;;
            *) echo "::error::Unknown package '${{ inputs.pkg }}'"; exit 1 ;;
          esac

      - name: Validate version matches <pkg>/package.json
        run: |
          declared=$(node -p "require('./${{ inputs.pkg }}/package.json').version")
          if [ "$declared" != "${{ inputs.version }}" ]; then
            echo "::error::Input version ${{ inputs.version }} does not match ${{ inputs.pkg }}/package.json version $declared."
            echo "::error::Edit ${{ inputs.pkg }}/package.json to ${{ inputs.version }} and commit, OR re-run with the correct version."
            exit 1
          fi

      - name: Validate git tag does not already exist
        run: |
          tag="${{ inputs.pkg }}-v${{ inputs.version }}"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists locally — pull latest main and confirm you are not duplicating a prior release."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "::error::Tag $tag already exists on origin — this version has been released before."
            exit 1
          fi

      - name: Validate CHANGELOG.md has an entry for this version
        run: |
          file="${{ inputs.pkg }}/CHANGELOG.md"
          version="${{ inputs.version }}"
          if [ ! -f "$file" ]; then
            echo "::error::CHANGELOG.md not found at $file"
            exit 1
          fi
          if ! grep -qF "$version" "$file"; then
            echo "::error::CHANGELOG.md at $file does not mention version $version."
            echo "::error::Add a section for $version (Keep-a-Changelog format) and commit before re-running."
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Topological build order (maic → him → nhe → eval / cloud / distill).
      # See `.github/workflows/test.yml` for the rationale.
      - name: Build maic (topological root)
        run: npm run build --workspace @teleologyhi-sdk/maic

      - name: Build remaining workspaces
        run: npm run build --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test (full cross-workspace suite)
        run: npm run test --workspaces --if-present

      - name: Pack dry-run (sanity check the artefact shape that would ship to npm)
        run: npm pack --workspace "@teleologyhi-sdk/${{ inputs.pkg }}" --dry-run

      - name: Configure git for tag creation
        run: |
          git config user.name "TeleologyHI Release Bot"
          git config user.email "noreply@teleologyhi.com"

      - name: Create and push git tag
        run: |
          tag="${{ inputs.pkg }}-v${{ inputs.version }}"
          git tag -a "$tag" -m "@teleologyhi-sdk/${{ inputs.pkg }}@${{ inputs.version }} — GitHub release (not yet on NPMJS)"
          git push origin "$tag"

      - name: Extract changelog section for this release
        id: changelog
        run: |
          file="${{ inputs.pkg }}/CHANGELOG.md"
          version="${{ inputs.version }}"
          body=$(awk -v v="$version" '
            BEGIN { in_section = 0 }
            /^## / {
              if (in_section) { exit }
              if (index($0, v) > 0) { in_section = 1; print; next }
            }
            in_section { print }
          ' "$file" || true)
          if [ -z "$body" ]; then
            body="Release of @teleologyhi-sdk/${{ inputs.pkg }}@${{ inputs.version }} (GitHub-side only; not yet on NPMJS). See [CHANGELOG.md](${file}) for details."
          fi
          # Prefix the body with the review-required banner so the release
          # page makes the state obvious at first glance.
          {
            printf '%s\n\n' "> **STATUS: REVIEW REQUIRED — NOT YET ON NPMJS.** This GitHub Release was created by the \`release.yml\` workflow. The Creator must review the contents (tag, changelog, attached commit, pack-smoke result in the workflow logs) and then explicitly run \`npm-publish.yml\` to publish this version to the npm registry."
            printf '%s\n' "$body"
          } > /tmp/release-body.md
          echo "body_file=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (review-required)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.pkg }}-v${{ inputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping creation."
            exit 0
          fi
          gh release create "$tag" \
            --title "[REVIEW REQUIRED — NOT YET ON NPMJS] @teleologyhi-sdk/${{ inputs.pkg }}@${{ inputs.version }}" \
            --notes-file "${{ steps.changelog.outputs.body_file }}" \
            --verify-tag

      - name: Summary
        run: |
          echo "─────────────────────────────────────────────────"
          echo "  Step 1 of 2 completed: GitHub Release created."
          echo "    Package          : @teleologyhi-sdk/${{ inputs.pkg }}"
          echo "    Version          : ${{ inputs.version }}"
          echo "    Git tag (pushed) : ${{ inputs.pkg }}-v${{ inputs.version }}"
          echo "    GitHub Release   : https://github.com/${{ github.repository }}/releases/tag/${{ inputs.pkg }}-v${{ inputs.version }}"
          echo "    Status           : REVIEW REQUIRED — not yet on NPMJS"
          echo ""
          echo "  Next step (Creator-triggered after review):"
          echo "    gh workflow run npm-publish.yml \\"
          echo "      -f pkg=${{ inputs.pkg }} \\"
          echo "      -f version=${{ inputs.version }} \\"
          echo "      -f confirm=I-AM-THE-CREATOR-AND-I-PUBLISH-TO-NPMJS"
          echo "─────────────────────────────────────────────────"
