name: arena-deploy

# ─── Status: SCAFFOLD ────────────────────────────────────────────────
#
# This workflow is a non-executable placeholder. It documents the
# contract for the future arena deploy to the Creator's Debian 12 VPS
# (the same machine that hosts `teleologyhi.com` and will host the
# `cloud/` RemoteMaic server). The workflow's `enabled` job exits 1
# until the Creator confirms the necessary secrets have been configured
# in the GitHub repository.
#
# Required secrets (must be added before this workflow becomes
# executable; documented here so the Creator has a checklist):
#
#   ARENA_DEPLOY_SSH_KEY          private key for the deploy user on
#                                 the Debian 12 host (read-only on the
#                                 GitHub side via secrets)
#   ARENA_DEPLOY_SSH_HOST         host name (e.g., teleologyhi.com)
#   ARENA_DEPLOY_SSH_USER         deploy user (NOT root)
#   ARENA_DEPLOY_PATH             absolute path on the host where the
#                                 build is rsynced (e.g.,
#                                 /var/www/teleologyhi.com/arena)
#   ARENA_GEMINI_API_KEY          Gemini API key for the deployed arena
#                                 (governance pathway runs against real
#                                 Gemini per the smoke test on
#                                 2026-05-24)
#   ARENA_RESTART_COMMAND         the command the deploy user can run
#                                 with sudo (e.g.,
#                                 "sudo systemctl restart arena.service")
#
# Once configured: remove the `disabled` job and uncomment the deploy
# steps. The Creator triggers the workflow manually via:
#
#   gh workflow run arena-deploy.yml \
#     -f environment=production \
#     -f confirm=YES-DEPLOY-ARENA-TO-PRODUCTION
#
# The Creator's binding rule: this workflow NEVER runs on push to main.
# Deploys are always Creator-triggered, individual, atomic.
#
# ─── Architecture (per RELEASING.md §5.3) ────────────────────────────
#
# arena is a Next.js 16 server-rendered app. The deploy plan:
#
#   1. Build the Next.js production bundle on the Ubuntu runner.
#   2. rsync the build output to ARENA_DEPLOY_PATH on the host.
#   3. systemctl restart the arena service.
#   4. Smoke-test the deployed endpoint with a single GET /healthz.
#
# Out of scope for this workflow: provisioning the host, configuring
# nginx, issuing TLS certificates. Those are one-time bare-metal setups
# documented in (future) `arena/DEPLOY.md`.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target environment."
        required: true
        type: choice
        options:
          - production
          - staging
      confirm:
        description: 'Type exactly: "YES-DEPLOY-ARENA-TO-PRODUCTION"'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arena-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  disabled:
    # ─── REMOVE THIS JOB WHEN SECRETS ARE CONFIGURED ─────────────────
    # Until the Creator confirms the required secrets exist on the
    # GitHub repository, this workflow MUST fail loudly. A silently
    # successful no-op deploy is worse than a clear refusal.
    name: refuse (not yet wired)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse and explain
        run: |
          echo "::error::arena-deploy.yml is a scaffold and is not yet executable."
          echo "::error::Required repository secrets:"
          echo "::error::  - ARENA_DEPLOY_SSH_KEY"
          echo "::error::  - ARENA_DEPLOY_SSH_HOST"
          echo "::error::  - ARENA_DEPLOY_SSH_USER"
          echo "::error::  - ARENA_DEPLOY_PATH"
          echo "::error::  - ARENA_GEMINI_API_KEY"
          echo "::error::  - ARENA_RESTART_COMMAND"
          echo "::error::Once configured (see the in-file comments), remove this 'disabled' job and the 'deploy' job will take over."
          exit 1

